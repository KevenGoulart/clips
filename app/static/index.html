<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clips IA</title>
<style>
  :root { --bg:#0e0f13; --card:#181a21; --line:#2a2d38; --text:#eceef4; --muted:#8b90a0; --accent:#ffd400; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin:0 0 4px; font-size: 28px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; display:grid; gap:16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > label { flex:1 1 160px; }
  label { display:grid; gap:6px; color:var(--muted); font-size:13px; }
  input, select { background:#0f1116; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:11px 12px; font:inherit; width:100%; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .check { display:flex; align-items:center; gap:8px; color:var(--text); font-size:14px; }
  .check input { width:auto; }
  button { background:var(--accent); color:#000; border:0; border-radius:10px; padding:13px 18px; font:600 15px system-ui; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #status { margin-top:20px; display:none; }
  #log { background:#0a0b0e; border:1px solid var(--line); border-radius:10px; padding:12px; font:12.5px/1.6 Consolas, monospace; color:var(--muted); max-height:220px; overflow:auto; white-space:pre-wrap; }
  #log .err { color: var(--err); }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:16px; margin-top:20px; }
  .clip { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .clip video { width:100%; aspect-ratio:9/16; background:#000; display:block; }
  .clip .body { padding:12px; display:grid; gap:6px; }
  .clip h3 { margin:0; font-size:15px; }
  .meta { color:var(--muted); font-size:12.5px; }
  .desc { font-size:13px; background:#0f1116; border-radius:8px; padding:8px; white-space:pre-wrap; }
  .actions { display:flex; gap:8px; }
  .actions a, .actions button { flex:1; text-align:center; text-decoration:none; font-size:13px; padding:9px; border-radius:8px; }
  .actions a { background:var(--accent); color:#000; font-weight:600; }
  .actions button { background:#262935; color:var(--text); font-weight:500; }
  .spinner { display:inline-block; width:12px; height:12px; border:2px solid var(--muted); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; vertical-align:-1px; margin-right:6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .yt { display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:16px; font-size:14px; }
  .yt .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
  .yt .dot.on { background:#3ddc84; }
  .yt span { flex:1; }
  .yt button { padding:8px 14px; font-size:13px; }
  .yt button.ghost { background:#262935; color:var(--text); }
  .yt button.danger { background:#3a1d22; color:var(--err); }
  .storage { margin:16px 0 0; color:var(--muted); }
  .clip input, .clip textarea, .clip select { font-size:13px; padding:8px; border-radius:8px; }
  .clip textarea { background:#0f1116; border:1px solid var(--line); color:var(--text); font:inherit; font-size:13px; padding:8px; border-radius:8px; width:100%; resize:vertical; min-height:64px; }
  .publish { display:grid; gap:6px; border-top:1px solid var(--line); padding-top:10px; margin-top:4px; }
  .publish button { padding:9px; font-size:13px; background:#ff0033; color:#fff; }
  .up { font-size:12.5px; color:var(--muted); }
  .up a { color:var(--accent); }
  .up.err { color:var(--err); }
  .bar { height:4px; background:#262935; border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#ff0033; transition:width .3s; }
</style>
</head>
<body>
<main>
  <h1>Clips <span>IA</span></h1>
  <p class="sub">Cole um link do YouTube. A IA encontra os melhores momentos e entrega cortes verticais 9:16 com título e legenda.</p>

  <div class="yt">
    <i class="dot" id="ytDot"></i>
    <span id="ytText">Verificando conexão com o YouTube...</span>
    <button type="button" id="ytBtn" style="display:none"></button>
  </div>

  <form id="form">
    <label>Link do YouTube
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
    </label>
    <div class="row">
      <label>Duração máxima
        <select id="duration"><option value="30">Até 30 segundos</option><option value="60" selected>Até 1 minuto</option></select>
      </label>
      <label>Quantidade de cortes
        <select id="count"><option>1</option><option>2</option><option>3</option><option>5</option><option>8</option><option>10</option><option>15</option><option selected>20</option></select>
      </label>
      <label>Enquadramento
        <select id="crop_mode">
          <option value="auto">Automático</option>
          <option value="crop">Seguir rosto (corte)</option>
          <option value="blur">Vídeo inteiro + fundo desfocado</option>
        </select>
      </label>
      <label>Idioma do vídeo
        <select id="language"><option value="">Detectar</option><option value="pt" selected>Português</option><option value="en">Inglês</option><option value="es">Espanhol</option></select>
      </label>
    </div>
    <label class="check"><input id="subtitles" type="checkbox" checked> Legendas animadas palavra por palavra</label>
    <label class="check"><input id="auto_upload" type="checkbox"> Publicar automaticamente no YouTube ao terminar</label>
    <button id="go" type="submit">Gerar cortes</button>
  </form>

  <div class="yt storage">
    <span id="stText">Calculando espaço usado...</span>
    <button type="button" id="stBtn" class="danger">Apagar todos</button>
  </div>

  <section id="status">
    <p id="state" class="meta"></p>
    <div id="log"></div>
    <div id="clips" class="grid"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let timer;

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("go").disabled = true;
  $("clips").innerHTML = "";
  $("status").style.display = "block";
  const body = {
    url: $("url").value.trim(),
    duration: +$("duration").value,
    count: +$("count").value,
    crop_mode: $("crop_mode").value,
    subtitles: $("subtitles").checked,
    language: $("language").value || null,
    auto_upload: $("auto_upload").checked,
  };
  rendered = null;
  try {
    const r = await fetch("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const job = await r.json();
    if (!r.ok) throw new Error(job.detail || "Erro ao criar job");
    poll(job.id);
  } catch (err) {
    render({ status: "error", log: [String(err.message || err)], clips: [] });
    $("go").disabled = false;
  }
});

let rendered = null, currentJob = null;

function poll(id) {
  clearTimeout(timer);
  fetch(`/api/jobs/${id}`).then(r => r.json()).then(job => {
    currentJob = job;
    render(job);
    const busy = job.status === "queued" || job.status === "running";
    const uploading = Object.values(job.uploads || {}).some(u => u.state === "queued" || u.state === "uploading");
    if (!busy) { $("go").disabled = false; stRefresh(); }
    if (busy || uploading) timer = setTimeout(() => poll(id), 1500);
  }).catch(() => { timer = setTimeout(() => poll(id), 3000); });
}

// ------------------------------------------------------------------ YouTube
let ytConnected = false;

async function ytRefresh() {
  const s = await fetch("/api/youtube/status").then(r => r.json()).catch(() => ({}));
  ytConnected = !!s.connected;
  $("ytDot").className = "dot" + (s.connected ? " on" : "");
  const btn = $("ytBtn");
  btn.style.display = "";
  btn.className = "";
  if (!s.configured) {
    $("ytText").textContent = "YouTube não configurado: coloque o client_secret.json na pasta do projeto (veja o README).";
    btn.style.display = "none";
  } else if (s.login_running) {
    $("ytText").textContent = "Autorize o acesso na aba do Google que foi aberta...";
    btn.style.display = "none";
    setTimeout(ytRefresh, 2000);
  } else if (s.connected) {
    $("ytText").innerHTML = `YouTube conectado: <b>${esc(s.channel)}</b>`;
    btn.textContent = "Desconectar"; btn.className = "ghost";
    btn.onclick = async () => { await fetch("/api/youtube/logout", { method: "POST" }); ytRefresh(); };
  } else {
    $("ytText").textContent = s.login_error ? `Falha ao conectar: ${s.login_error}` : "YouTube não conectado.";
    btn.textContent = "Conectar YouTube";
    btn.onclick = async () => { await fetch("/api/youtube/login", { method: "POST" }); setTimeout(ytRefresh, 800); };
  }
  document.querySelectorAll(".publish button").forEach(b => b.disabled = !ytConnected || b.dataset.sent === "1");
}
ytRefresh();

// ------------------------------------------------------------------ armazenamento
function fmtBytes(b) {
  return b >= 1e9 ? `${(b / 1e9).toFixed(1)} GB` : `${Math.round(b / 1e6)} MB`;
}

async function stRefresh() {
  const s = await fetch("/api/storage").then(r => r.json()).catch(() => null);
  if (!s) return;
  $("stText").textContent = s.jobs
    ? `${s.jobs} pasta(s) na pasta output · ${fmtBytes(s.bytes)} (vídeos originais + cortes)`
    : "Nenhum arquivo salvo na pasta output.";
  $("stBtn").disabled = !s.jobs;
}
stRefresh();

$("stBtn").onclick = async () => {
  if (!confirm("Apagar TODOS os vídeos baixados e cortes da pasta output? Isso não pode ser desfeito.")) return;
  $("stBtn").disabled = true;
  const r = await fetch("/api/output", { method: "DELETE" }).then(r => r.json()).catch(() => null);
  if (r) {
    let msg = `${r.deleted} pasta(s) apagada(s).`;
    if (r.skipped) msg += ` ${r.skipped} em andamento foi(ram) mantida(s).`;
    if (r.failed.length) msg += ` ${r.failed.length} não pôde(puderam) ser apagada(s) (arquivo aberto em outro programa).`;
    alert(msg);
    if (currentJob && !["queued", "running"].includes(currentJob.status)) {
      $("clips").innerHTML = ""; rendered = null;
    }
  }
  stRefresh();
};

async function publish(i) {
  const c = currentJob.clips[i];
  const body = {
    job_id: currentJob.id, file: c.file,
    title: $(`t${i}`).value, description: $(`d${i}`).value,
  };
  const r = await fetch("/api/youtube/upload", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { const e = await r.json(); $(`u${i}`).className = "up err"; $(`u${i}`).textContent = e.detail; return; }
  poll(currentJob.id);
}

function renderUploads(job) {
  job.clips.forEach((c, i) => {
    const u = (job.uploads || {})[c.file], el = $(`u${i}`), btn = $(`b${i}`);
    if (!u || !el) return;
    btn.dataset.sent = u.state === "error" ? "0" : "1";
    btn.disabled = !ytConnected || btn.dataset.sent === "1";
    el.className = "up" + (u.state === "error" ? " err" : "");
    el.innerHTML = {
      queued: "Na fila de envio...",
      uploading: `Enviando ${u.progress}% <div class="bar"><i style="width:${u.progress}%"></i></div>`,
      done: `Publicado: <a href="${esc(u.url)}" target="_blank">${esc(u.url)}</a>`,
      error: `Erro: ${esc(u.error)}`,
    }[u.state] || "";
  });
}

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML.replace(/"/g, "&quot;"); }
function mmss(t) { t = Math.floor(t); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; }

function render(job) {
  const labels = { queued: "Na fila", running: "Processando", done: "Concluído", error: "Falhou" };
  const busy = job.status === "queued" || job.status === "running";
  $("state").innerHTML = (busy ? '<span class="spinner"></span>' : "") + (labels[job.status] || "");
  $("log").innerHTML = job.log.map(l => `<div class="${l.includes("ERRO") ? "err" : ""}">${esc(l)}</div>`).join("");
  $("log").scrollTop = $("log").scrollHeight;
  if (job.status !== "done") return;
  if (rendered !== job.id) {  // monta os cards uma vez só, para não apagar o que foi editado
    rendered = job.id;
    $("clips").innerHTML = job.clips.map((c, i) => `
    <article class="clip">
      <video src="/output/${job.id}/${c.file}" controls preload="metadata" playsinline></video>
      <div class="body">
        <input id="t${i}" value="${esc(c.title)}" maxlength="100" title="Título no YouTube">
        <div class="meta">${mmss(c.start)} – ${mmss(c.end)} · ${Math.round(c.end - c.start)}s · nota ${c.score}</div>
        <div class="meta">${esc(c.reason)}</div>
        <textarea id="d${i}" title="Descrição no YouTube">${esc(c.description)}</textarea>
        <div class="actions">
          <a href="/api/download/${job.id}/${c.file}">Baixar</a>
        </div>
        <div class="publish">
          <button type="button" id="b${i}" onclick="publish(${i})" ${ytConnected ? "" : "disabled"}>Publicar no YouTube</button>
          <div class="up" id="u${i}"></div>
        </div>
      </div>
    </article>`).join("");
  }
  renderUploads(job);
}
</script>
</body>
</html>
